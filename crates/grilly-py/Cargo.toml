[package]
name = "grilly-py"
version = "0.1.0"
description = "Python extension module (grilly._C) for grilly2"
edition.workspace = true
license.workspace = true

[lib]
name = "_C"
crate-type = ["cdylib"]

[dependencies]
grilly-core = { path = "../grilly-core" }
grilly-infer = { path = "../grilly-infer" }
grilly-torch = { path = "../grilly-torch" }
grilly-vsa = { path = "../grilly-vsa" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
