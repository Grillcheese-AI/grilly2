# Wheels, and the PyPI release.
#
# The point of this file is that a user installs grilly2 with pip and needs
# none of what building it needs. Building needs Rust, a C++17 compiler and
# the LunarG SDK; running needs a GPU driver, which the user already has.
# All of the first list happens here, once, on a runner.
#
# `grilly2` on PyPI, `import grilly` in code — see pyproject.toml for why.
# The extension is abi3 (pyo3 `abi3-py310`), so one wheel per platform
# serves every CPython from 3.10 up.
#
# Things that are deliberate and easy to "fix" wrongly:
#
#   * the wheel does NOT bundle libvulkan (`--auditwheel skip`). The Vulkan
#     loader must be the one the user's GPU driver installed, matched to
#     that driver; torch and cupy skip repair for their GPU runtimes for
#     the same reason.
#
#   * the Linux wheel is built on ubuntu-22.04 and tagged manylinux_2_35,
#     not in a manylinux_2_28 container. shaderc is not packaged for the
#     manylinux images and building it there is a slow, fragile detour; the
#     LunarG SDK's own Linux build targets 22.04. The cost is that glibc
#     older than 2.35 (RHEL 8, Ubuntu 20.04) gets the sdist instead. The
#     `auditwheel show` step prints what the binary actually requires, so
#     that tag is checked rather than asserted.
#
#   * the sdist is published, but building from it still needs the SDK.
#     pip falls back to it on any platform without a wheel, so build.rs's
#     error message is a user-facing string, not a developer note.
#
# Publishing uses PyPI trusted publishing (OIDC): no token is stored in
# this repository. It needs a one-time publisher entry on pypi.org naming
# this repository, `release.yml` and the `pypi` environment.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "publish to PyPI (otherwise wheels are attached to the run only)"
        type: boolean
        default: false

env:
  VULKAN_SDK_VERSION: 1.4.335.0

jobs:
  windows:
    # the headline platform: CLAUDE.md §2's position is consumer AMD and
    # Intel cards under Windows, which is precisely where torch will not train
    name: wheel (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          stripdown: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: build
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist --auditwheel skip
      - name: the wheel must not reference this runner
        run: python .github/scripts/check_relocatable.py dist
      - uses: actions/upload-artifact@v4
        with: { name: wheels-windows, path: dist/*.whl }

  linux:
    name: wheel (linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: build
        run: |
          python -m pip install --upgrade pip maturin auditwheel
          maturin build --release --out dist --auditwheel skip --compatibility manylinux_2_35
      - name: the wheel must not reference this runner
        run: python .github/scripts/check_relocatable.py dist
      # informational: what the binary really needs. libvulkan.so.1 is
      # listed as external on purpose (see the header).
      - name: what the wheel requires
        run: auditwheel show dist/*.whl
      - uses: actions/upload-artifact@v4
        with: { name: wheels-linux, path: dist/*.whl }

  smoke:
    # install each wheel on a clean runner and run real kernels on lavapipe;
    # a wheel that builds but cannot import must never reach PyPI
    name: smoke test (linux wheel on lavapipe)
    needs: linux
    runs-on: ubuntu-latest
    env:
      ALLOW_CPU_VULKAN: "1"
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }   # the oldest the abi3 tag claims
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - uses: actions/download-artifact@v4
        with: { name: wheels-linux, path: dist }
      - name: install and run
        run: |
          python -m pip install dist/*.whl
          python -m grilly.doctor
          python - <<'EOF'
          import grilly as torch
          x = torch.randn(64, 32, requires_grad=True)
          lin = torch.nn.Linear(32, 8)
          loss = torch.nn.functional.relu(lin(x)).sum()
          loss.backward()
          assert x.grad.shape == (64, 32), x.grad.shape
          print("forward + backward ok:", float(loss))
          EOF

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist
      # VMA is a submodule; an sdist without its header cannot build
      - name: the sdist carries the VulkanMemoryAllocator header
        run: tar tzf dist/*.tar.gz | grep -q "third_party/VulkanMemoryAllocator/include/vk_mem_alloc.h"
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  publish:
    name: publish to PyPI
    needs: [windows, linux, smoke, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no API token to leak
    steps:
      - uses: actions/checkout@v4
      # a version on PyPI can never be re-uploaded, so a tag that disagrees
      # with pyproject.toml must stop here, not after the upload
      - name: the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME != pyproject $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # a re-run must not fail on files already uploaded
          skip-existing: true
