# CI.
#
# GitHub's runners have no GPU. They do have a CPU, and Mesa's lavapipe is
# a conformant Vulkan 1.3 driver that runs on one, so the `gpu-tests` job
# executes the real kernels — the same SPIR-V, the same dispatch path —
# through a software device. That catches wrong numbers, broken builds and
# missing kernels. It does NOT measure speed and it is not the RX 6750 XT:
# driver bugs, memory placement (CLAUDE.md §11's batch footprint) and the
# fence timeout only show up on real hardware, so the benchmark and
# stress numbers stay manual. `device.cpp` refuses a CPU device unless
# ALLOW_CPU_VULKAN=1, which is set only here.
#
# The other thing CI catches is the class of bug a working development
# machine is blind to: a build that only works where it was built. grilly2
# shipped exactly that — the SPIR-V directory was baked in as the build
# machine's absolute OUT_DIR, so a wheel would have failed at `import
# grilly` for every user. `check_relocatable.py` guards it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # pinned to what the development machine builds with (shaderc v2025.5)
  VULKAN_SDK_VERSION: 1.4.335.0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }   # VulkanMemoryAllocator
      # Pinned, unlike the builds: every Rust release adds clippy lints, and
      # under -D warnings that turns CI red with no change to the code (1.99
      # did, the week this job first ran). Bump this deliberately, fixing
      # what the new lints find in the same commit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: "clippy, rustfmt"
      - name: fmt
        run: cargo fmt --all --check
      # clippy runs the build scripts, which compile the C++ layer and the
      # kernels, so it needs the SDK too
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      # a BUILD dependency only: headers, the loader's import library,
      # shaderc and glslc. Nothing it installs is needed to run the wheel.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          stripdown: true
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Windows only: the Linux leg compiles and runs every test in
      # gpu-tests, so compiling them here as well would be paid twice
      - name: compile the Rust tests
        if: runner.os == 'Windows'
        run: cargo test --workspace --release --no-run
      # --auditwheel skip: see release.yml — libvulkan must be the driver's
      - name: build the extension
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist --auditwheel skip
      - name: the built extension must not reference its build directory
        run: python .github/scripts/check_relocatable.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  gpu-tests:
    name: tests on lavapipe (software Vulkan)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALLOW_CPU_VULKAN: "1"
      GRILLY_PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: lavapipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: wheel-ubuntu-latest, path: dist }
      # the wheel, not the source tree: this is what a user installs
      # The references are pinned to the versions the suites were written
      # against, like the SDK. torch 2.15 made flex_attention refuse backward
      # on CPU and SDPA refuse attn_mask with is_causal, failing 13 tests on
      # torch's side, not grilly's. Bump these deliberately.
      - name: install the wheel and the references
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pytest-timeout transformers==5.5.1
          python -m pip install "$(ls dist/*.whl)[huggingface]"
      - name: the device opens
        run: python -m grilly.doctor
      # Skipped on lavapipe ONLY, by name. Each asserts a precision the
      # RX 6750 XT has and Vulkan does not promise, measured failing here
      # on 2026-11-11 (Mesa llvmpipe, LLVM 21). They stay strict on hardware.
      #
      #   div_rn: Markstein division needs fma() to round once. Vulkan lets
      #     fma be a separate mul + add, and lavapipe's is: 1 ULP off.
      #   the int8 / int4 quantizer tests: bit-exact against torchao through
      #     div_rn. 4 of 57,344 int8 values tip from -127 to -128 at a row's
      #     absmax; one int4 scale is 1 ULP off. The kernels are right.
      #   int8 linear vs float64: same quantized weights, one of them flipped.
      #   transcendentals within 2 ULP: Vulkan bounds log() by absolute
      #     error near 1, which is 1677 ULP there on lavapipe.
      #
      # Anything else failing here is a real regression.
      - name: rust tests
        run: >
          cargo test --workspace --release --no-fail-fast -- --test-threads=2
          --skip div_rn_is_correctly_rounded
          --skip quantized_values_are_torchaos_exactly
          --skip quantized_values_follow_torchaos_formula_exactly
          --skip linear_matches_a_float64_reference_within_its_bound
          --skip transcendental_unary_ops_within_2_ulp
      # quant4.rs has a test of the same name that passes here; the skip
      # above cannot tell the two apart, so the int4 one runs on its own
      - name: rust tests (int4 linear)
        if: ${{ !cancelled() }}
        run: >
          cargo test --release -p grilly-infer --test quant4 --
          linear_matches_a_float64_reference_within_its_bound --exact
      # run from outside the repo so `import grilly` cannot resolve to
      # python/grilly in the checkout, which has no compiled _C in it
      - name: python tests
        if: ${{ !cancelled() }}   # report these even when a Rust test failed
        working-directory: ${{ runner.temp }}
        run: |
          t=tests/python
          lavapipe_only=(
            # div_rn (see the Rust step): bit-exact against torchao / HF
            $t/test_quantization.py::test_quantized_values_are_torchaos
            $t/test_quantization.py::test_linear_is_within_its_float64_bound
            $t/test_quantization.py::test_a_quantized_model_matches_torchaos_math_in_torch
            $t/test_quantization.py::test_int4_values_follow_torchaos_formula
            # temperature, penalty and normalisation all divide with div_rn
            $t/test_sampling.py::test_processed_scores_are_hfs_bit_for_bit
            $t/test_sampling.py::test_filtered_distribution_is_hfs
            # 2.09x torch's float32 error at length 9; lavapipe's exp/log
            "$t/test_cubby.py::test_a_prompt_matches_cubbyllm[memory-9]"
            # a batch sized to take >2 s on a GPU passes 600 s on a CPU
            $t/test_long_batches.py::test_a_batch_longer_than_two_seconds_completes_correctly
            # NOT precision: a real bug. add_ on 4096x4096 dispatches 65,536
            # workgroups in x; Vulkan guarantees 65,535 and lavapipe allows
            # no more. The v1-era kernels (g2-add, g2-add-inplace, g2-relu,
            # g2-relu-backward) launch 1-D instead of launch_flat. Remove
            # this line with the fix.
            $t/test_es.py::test_the_perturbation_has_unit_variance_at_every_rank
          )
          python -m pytest "$GITHUB_WORKSPACE/$t" --rootdir "$GITHUB_WORKSPACE" \
            -p no:cacheprovider --timeout 600 -ra -q \
            "${lavapipe_only[@]/#/--deselect=}"

  no-gpu:
    # A machine with no Vulkan device at all: exactly where a user with a
    # broken driver is. The doctor must still run and must still say so —
    # a crash instead of a diagnosis is the one unforgivable outcome.
    name: doctor without a GPU
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: wheel-ubuntu-latest, path: dist }
      - name: install the wheel, not the source tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
      - name: the doctor survives a machine with no GPU
        working-directory: ${{ runner.temp }}
        run: |
          if python -m grilly.doctor > out.txt 2>&1; then
            cat out.txt; echo "unexpected: the doctor found a usable device"; exit 1
          fi
          cat out.txt
          grep -q "FAIL" out.txt || { echo "doctor reported no failure without a GPU"; exit 1; }
          grep -q "python" out.txt || { echo "doctor did not report the interpreter"; exit 1; }
