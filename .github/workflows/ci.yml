# CPU-only CI.
#
# GitHub's runners have no Vulkan GPU, so the kernels cannot be executed
# here and the GPU suites stay manual on the RX 6750 XT. That is a real
# limit and it is written down rather than worked around.
#
# What this *can* catch is the class of bug a working development machine
# is blind to: a build that only works where it was built. grilly2 shipped
# exactly that — the SPIR-V directory was baked in as the build machine's
# absolute OUT_DIR, so the extension broke if the repo moved and a wheel
# would have failed at `import grilly` for every user. Nothing on a dev box
# can see that. `relocatable` below does.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VULKAN_SDK_VERSION: 1.3.280.0

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive        # VulkanMemoryAllocator

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # the SDK is a BUILD dependency only: headers, vulkan-1, shaderc and
      # glslc. Nothing it installs is needed to run a built wheel.
      - name: Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools, Shaderc
          vulkan-use-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # `--no-run` because there is no GPU here: this compiles every test,
      # which is most of their value on a machine that cannot execute them.
      - name: build tests
        run: cargo test --all --release --no-run

      - name: build the extension
        run: |
          python -m pip install --upgrade pip maturin numpy
          maturin build --release --out dist

      - name: the built extension must not reference its build directory
        shell: bash
        run: python .github/scripts/check_relocatable.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  cpu-tests:
    # the parts of the Python layer that never reach the GPU: packaging
    # metadata, the torch-alias plugin, the doctor's own logic
    name: cpu tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest
          path: dist
      - name: install the wheel, not the source tree
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.whl
      # `import grilly` opens the device, which cannot work here. The doctor
      # must still run and must still say so, because that is precisely the
      # situation a user with no Vulkan driver is in — and it is the one
      # case where a crash instead of a diagnosis is unforgivable.
      - name: the doctor survives a machine with no GPU
        run: |
          python -m grilly.doctor && echo "unexpected: a GPU appeared" && exit 1 || true
          python -m grilly.doctor | tee out.txt
          grep -q "FAIL" out.txt || (echo "doctor reported no failure without a GPU" && exit 1)
          grep -q "python" out.txt || (echo "doctor did not report the interpreter" && exit 1)
