# CI.
#
# GitHub's runners have no GPU. They do have a CPU, and Mesa's lavapipe is
# a conformant Vulkan 1.3 driver that runs on one, so the `gpu-tests` job
# executes the real kernels — the same SPIR-V, the same dispatch path —
# through a software device. That catches wrong numbers, broken builds and
# missing kernels. It does NOT measure speed and it is not the RX 6750 XT:
# driver bugs, memory placement (CLAUDE.md §11's batch footprint) and the
# fence timeout only show up on real hardware, so the benchmark and
# stress numbers stay manual. `device.cpp` refuses a CPU device unless
# ALLOW_CPU_VULKAN=1, which is set only here.
#
# The other thing CI catches is the class of bug a working development
# machine is blind to: a build that only works where it was built. grilly2
# shipped exactly that — the SPIR-V directory was baked in as the build
# machine's absolute OUT_DIR, so a wheel would have failed at `import
# grilly` for every user. `check_relocatable.py` guards it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # pinned to what the development machine builds with (shaderc v2025.5)
  VULKAN_SDK_VERSION: 1.4.335.0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }   # VulkanMemoryAllocator
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - name: fmt
        run: cargo fmt --all --check
      # clippy runs the build scripts, which compile the C++ layer and the
      # kernels, so it needs the SDK too
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      # a BUILD dependency only: headers, the loader's import library,
      # shaderc and glslc. Nothing it installs is needed to run the wheel.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          stripdown: true
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Windows only: the Linux leg compiles and runs every test in
      # gpu-tests, so compiling them here as well would be paid twice
      - name: compile the Rust tests
        if: runner.os == 'Windows'
        run: cargo test --workspace --release --no-run
      # --auditwheel skip: see release.yml — libvulkan must be the driver's
      - name: build the extension
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist --auditwheel skip
      - name: the built extension must not reference its build directory
        run: python .github/scripts/check_relocatable.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  gpu-tests:
    name: tests on lavapipe (software Vulkan)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALLOW_CPU_VULKAN: "1"
      GRILLY_PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: lavapipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: wheel-ubuntu-latest, path: dist }
      # the wheel, not the source tree: this is what a user installs
      - name: install the wheel and the references
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pytest-timeout
          python -m pip install "$(ls dist/*.whl)[huggingface]"
      - name: the device opens
        run: python -m grilly.doctor
      - name: rust tests
        run: cargo test --workspace --release -- --test-threads=2
      # run from outside the repo so `import grilly` cannot resolve to
      # python/grilly in the checkout, which has no compiled _C in it
      - name: python tests
        working-directory: ${{ runner.temp }}
        run: >
          python -m pytest "$GITHUB_WORKSPACE/tests/python"
          --rootdir "$GITHUB_WORKSPACE" -p no:cacheprovider
          --timeout 600 -ra -q

  no-gpu:
    # A machine with no Vulkan device at all: exactly where a user with a
    # broken driver is. The doctor must still run and must still say so —
    # a crash instead of a diagnosis is the one unforgivable outcome.
    name: doctor without a GPU
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: wheel-ubuntu-latest, path: dist }
      - name: install the wheel, not the source tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
      - name: the doctor survives a machine with no GPU
        working-directory: ${{ runner.temp }}
        run: |
          if python -m grilly.doctor > out.txt 2>&1; then
            cat out.txt; echo "unexpected: the doctor found a usable device"; exit 1
          fi
          cat out.txt
          grep -q "FAIL" out.txt || { echo "doctor reported no failure without a GPU"; exit 1; }
          grep -q "python" out.txt || { echo "doctor did not report the interpreter"; exit 1; }
